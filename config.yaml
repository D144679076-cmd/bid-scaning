# Early spam/noise filter — hard skip before storage (phase M1).
noise_keywords:
  - "casino"
  - "crypto giveaway"
  - "follow for follow"
  - "SEO services"
  - "buy followers"

# Payment-ability gate (new rule 2026-11-02): a LEAD must show willingness
# or capacity to pay — any budget/fee/hiring/price signal counts. Posts with
# no money signal are stored as status 'unpaid' and never alerted.
# LLM re-verifies real pay capability in M2 classifier.
payment_signals:
  - "\\$\\d"
  - "\\€\\s?\\d"
  - "£\\s?\\d+"
  - "\\b\\d+\\s?(usd|eur|aud|cad|vnd)\\b"
  - "\\bbudget\\b"
  - "\\bpaid\\b"
  - "\\bpay(ing)?\\b"
  - "\\bwilling to pay\\b"
  - "\\bprice\\b"
  - "\\brate\\b"
  - "\\bhourly\\b"          # upwork tiles: "Hourly / Expert" without $ range
  - "\\bper hour\\b"
  - "\\bfixed price\\b"
  - "\\bfor hire\\b"
  - "\\blooking to hire\\b"
  - "\\bneed to hire\\b"
  - "\\bcommission\\b"
  - "\\bffers?\\b"
  # M9 Vietnamese money signals (fb tool-market groups; teencode tolerated)
  - "\\bgi[áa]\\b"                     # giá (price)
  - "\\bb[áa]o gi[áa]\\b"               # báo giá (quote)
  - "\\bbao nhi[êe]u\\b"                # bao nhiêu (how much)
  - "\\bth[ổo]a thu[ạa]n\\b"            # thỏa thuận (negotiable)
  - "\\bd[ựu] [áa]n\\b"                 # dự án (project = paid engagement)
  - "\\b\\d+([.,]\\d+)?\\s?(k|tr|tri[êe]u|vnd)\\b"
  - "\\b\\d+(?:[.,]\\d+)?(?:k|tr|tri[êe]u)[\\d.,]*\\b"  # 1tr5 / 2tr3 compounds
  - "\\bai\\b[^.]{0,60}\\btool\\b"      # "ai ... có tool nào ... không"
  - "\\bs[ôo] ti[êe]n\\b"               # số tiền
  - "\\bin?b?\\s?(hoặc|để)\\s?b[áa]o\\b"  # "ib để báo giá"
  - "\\bd[àa]t c[ôo]c\\b"               # đặt cọc (deposit)
  # Hire-phrase + product-word = explicit paid request in a hire-market
  # group (VN norm: price is requested in DM, ask never names money):
  - "\\bcần(\\s+tìm|\\s+thuê)?\\b[^.]{0,80}\\b(tool|code|phần mềm|bot|app|web|script)\\b"
  - "\\bthu[êe]\\b[^.]{0,60}\\b(code|tool|dev|làm|viết)\\b"
  - "\\b(tìm|ai)\\s?(người|bác|bạn|ae|các bác)?\\s?(làm|code|viết|giúp)\\b"
  - "\\bv[ềi]t\\s?v?c?od(e|ing)?\\b"    # "viết cod/cod" (sic, teencode)
  - "\\bvi[êe]t code\\b"
  - "\\bvi[êe]t app\\b"
  - "\\bvi[êe]t ch[ưư][ơo]ng tr[ìi]nh\\b"   # viết chương trình
  - "\\bcần người\\b"
  - "\\bthi (khkt|s[áa]ng t[ậa]o|hi[ểe]n|khph)\\b"  # KHKT/sáng tạo/hiện = fair-entry products
  - "\\b(thi|cu[ôô]c thi)\\s?(khkt|khoa học kỹ thuật|khoa h[ọo]c k[ỹy] thu[ậa]t)\\b"
  - "\\bs[ảa]n ph[ẩả]m thi\\b"      # sản phẩm thi (competition product)

# Amount extraction for display (client 2026-11-02: "show the paid amount
# in the message"). Matches get stored in `budget`, shown as 💰 in alerts.
# M1 heuristic only; M2 LLM refines (range, urgency, currency normalisation).
amount_patterns:
  - "\\$\\s?\\d[\\d,.]*\\s?(?:k|K|m|M)?(?:\\s?(?:-|–|to)\\s?\\$?\\s?\\d[\\d,.]*\\s?(?:k|K|m|M)?)?"
  - "€\\s?\\d[\\d,.]*\\s?(?:k|K)?"
  - "£\\s?\\d[\\d,.]*\\s?(?:k|K)?"
  - "\\b\\d[\\d,.]*\\s?(?:k|K)?\\s?(?:usd|EUR|aud|cad)\\b"
  - "\\bbudget(?:\\s+of|\\s+is|:)?\\s+\\d[\\d,.]*"
  # M9 Vietnamese amounts: "500k", "1tr5", "2 triệu", "giá 1.500.000đ"
  - "\\b\\d[\\d.,]*\\s?(?:k|tr|tri[êe]u)(?:\\d)?\\b"
  - "\\b\\d+(?:[.,]\\d+)?(?:k|tr|tri[êe]u)[\\d.,]*\\b"
  - "gi[áa]\\s?\\d[\\d.,]*\\s?(?:k|tr|tri[êe]u|vnd|đ)?"
  - "\\b\\d[\\d.,]*\\s?(?:vnd|vđ|đ)\\b"

# M9 (client 2026-11-06): per-source payment-gate policy. FB tool-market
# norm: post names NO money — deal starts in the inbox ("ib để báo giá"),
# requirement + price agreed in the conversation. `contact_first` sources
# survive the gate on a CONTACT signal + buyer-ask shape; all other
# sources keep the strict payment-signal gate unchanged.
gate_policy:
  facebook: contact_first

# contact signals = deal-entry markers (VN teencode + EN).
contact_signals:
  - "\\b(?:ib|inb|ib em|ib a)\\b"
  - "\\binbox\\b"
  - "\\b(?:dm|pm)\\s?(?:me|us)?\\b"
  - "\\bzalo\\b"
  - "\\btele(gram)?\\b"
  - "\\bsđt\\b"
  - "\\b0\\d{9}\\b"            # VN mobile 0XXXXXXXXX
  - "\\bhotline\\b"

# M10a (client 2026-11-06, docs/phase-m10-auto-send.md): suggested price
# per request = first tier whose keywords hit (order = priority; poster's
# own budget is NOT an input to our quote). Ranges live in profile.yaml.
pricing_match:
  - tier: "Retainer"
    keywords: ["ongoing", "monthly", "retainer", "long-term", "maintenance",
               "support", "holder studio", "cần thuê dài hạn"]
  - tier: "Workflow build"
    keywords: ["automation", "workflow", "scraper", "integration", "n8n",
               "zapier", "make.com", "api", "multi-step", "chatbot",
               "web app", "website", "dashboard", "saas", "crm", "erp",
               "lms", "ai agent", "pipeline", "tool", "bot", "extend",
               "làm tool", "viết code", "website khách"]
  - tier: "Quick fix"
    keywords: ["script", "one-off", "small", "zap", "tweak", "quick",
               "fix", "macro", "snippet", "hàm", "vụ nhỏ"]

# M10a auto-send wiring (docs/phase-m10-auto-send.md §3): each sender
# dispatches ONLY rows that were approved (✅) in Telegram — send queue =
# status 'approved' + no send_log record. mode: dry_run | auto | off.
senders:
  freelancer:
    enabled: true
    mode: dry_run           # week 1 validated every click except submit; flip
                            # to auto after 5 supervised sends (owner sign-off)
    state_file: data/session_freelancer.json
    daily_cap: 8
    cadence_seconds: 300
    hours: [8, 21]          # owner local-time send window; off-window = defer
  reddit:
    enabled: false          # M10b (needs OAuth script app from the owner)
    mode: off
  facebook_comment:
    enabled: false          # M10c (existing FB session; killswitch = 1 captcha hit)
    mode: off
