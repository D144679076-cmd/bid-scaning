# Bid Scanning — pipeline configuration (M1)
# Tokens/secrets NEVER here — use .env (TG_TOKEN, TG_CHAT_ID).

db:
  path: data/bidscan.db

alerts:
  # Telegram flood control (client feedback 2026-11-02: "send too fast")
  min_interval_seconds: 8
  max_per_run: 15

# LLM backend (M2). BOTH Ollama modes supported (client 2026-11-02).
# Machine reality check 2026-11-02: 7GB RAM + GTX1050 2GB →
#   LOCAL: qwen3:1.7b (1.4GB, best JSON discipline for size),
#          gemma3:1b (0.8GB, lighter), granite3.3:2b, gemma3
#   CLOUD-ONLY (useruggested): deepseek-v4-flash-0731, gemma4:cloud
#          (gemma4 local = 6.6GB → will not fit this box; "gemma4" as a
#          tag maps to cloud variant)
llm:
  active: local            # "local" | "cloud" — switch backends here
  profiles:
    local:                 # free, private, no key
      base_url: "http://localhost:11434/v1"
      model: "qwen3:1.7b"
      request_timeout: 180   # CPU+runtimes: 
    cloud:                 # ollama.com/cloud — needs LLM_API_KEY in .env
      base_url: "https://ollama.com/v1"
      model: "deepseek-v4-flash-0731"   # or gemma4:cloud; billed per token
      api_key_env: LLM_API_KEY
      request_timeout: 90
  temperature: 0.2
  retry: 2
  # Failover (client rule 2026-11-02): CLOUD FIRST, local as automatic
  # fallback when cloud is down / key missing. Disable by failover_enabled
  # false → then `active:` decides strictly.
  failover_enabled: true
  failover_order: [cloud, local]

# Approval threshold + digest rule (AGENTS.md, client update 2026-11-02):
# score >= 6 instant alert + buttons; score < 6 = status 'low', daily
# digest sorted by score descending.
classifier:
  instant_alert_min_score: 6
digest:
  enabled: true
  send_hour: 9           # 09:00 daily, low-score backlog + stats
  include_low_score: true
  max_low_items: 30

telegram:
  callbacks:
    poll_interval_seconds: 30   # button-press poller cadence

sources:
  reddit:
    enabled: true
    poll_rate_minutes: 15
    list_url: "https://www.reddit.com/r/{sub}/new.rss"
    subreddits:
      - automation
      - nocode
      - AI_Agents
      - AiAutomations
      - smallbusiness
      - Entrepreneur
      - n8n

# Buying-intent phrases people type when they want a tool built.
keywords:
  - "looking for someone to"
  - "need help automating"
  - "automate my"
  - "automate our"
  - "is there a tool that"
  - "is there an app that"
  - "any tool to"
  - "can someone build"
  - "need a developer"
  - "need a bot"
  - "need a script"
  - "build me a"
  - "want a zapier"
  - "want an n8n"
  - "make.com help"
  - "zapier expert"
  - "how to automate"
  - "save time with"
  - "drowning in manual"
  - "manual work"
  - "repetitive task"

# Early spam/noise filter — hard skip before storage (phase M1).
noise_keywords:
  - "casino"
  - "crypto giveaway"
  - "follow for follow"
  - "SEO services"
  - "buy followers"

# Payment-ability gate (new rule 2026-11-02): a LEAD must show willingness
# or capacity to pay — any budget/fee/hiring/price signal counts. Posts with
# no money signal are stored as status 'unpaid' and never alerted.
# LLM re-verifies real pay capability in M2 classifier.
payment_signals:
  - "\\$\\d"
  - "\\€\\s?\\d"
  - "£\\s?\\d+"
  - "\\b\\d+\\s?(usd|eur|aud|cad|vnd)\\b"
  - "\\bbudget\\b"
  - "\\bpaid\\b"
  - "\\bpay(ing)?\\b"
  - "\\bwilling to pay\\b"
  - "\\bprice\\b"
  - "\\brate\\b"
  - "\\bper hour\\b"
  - "\\bfixed price\\b"
  - "\\bfor hire\\b"
  - "\\blooking to hire\\b"
  - "\\bneed to hire\\b"
  - "\\bcommission\\b"
  - "\\bffers?\\b"

# Amount extraction for display (client 2026-11-02: "show the paid amount
# in the message"). Matches get stored in `budget`, shown as 💰 in alerts.
# M1 heuristic only; M2 LLM refines (range, urgency, currency normalisation).
amount_patterns:
  - "\\$\\s?\\d[\\d,.]*\\s?(?:k|K|m|M)?(?:\\s?(?:-|–|to)\\s?\\$?\\s?\\d[\\d,.]*\\s?(?:k|K|m|M)?)?"
  - "€\\s?\\d[\\d,.]*\\s?(?:k|K)?"
  - "£\\s?\\d[\\d,.]*\\s?(?:k|K)?"
  - "\\b\\d[\\d,.]*\\s?(?:k|K)?\\s?(?:usd|EUR|aud|cad)\\b"
  - "\\bbudget(?:\\s+of|\\s+is|:)?\\s+\\d[\\d,.]*"
