# Bid Scanning — pipeline configuration (M1)
# Tokens/secrets NEVER here — use .env (TG_TOKEN, TG_CHAT_ID).

db:
  path: data/bidscan.db

alerts:
  # Telegram flood control (client feedback 2026-11-02: "send too fast")
  min_interval_seconds: 8
  max_per_run: 15
  # M9 source fairness: alerts per source per cycle before we move on;
  # no source may flood the pool every run. Runtime override via Telegram
  # `/quota <source> <n>` (data/source_overrides.json) or `/quota <src> 0`
  # to mute a source entirely.
  per_source_per_cycle: 3

# LLM backend (M2). BOTH Ollama modes supported (client 2026-11-02).
# Machine reality check 2026-11-02: 7GB RAM + GTX1050 2GB →
#   LOCAL: qwen3:1.7b (1.4GB, best JSON discipline for size),
#          gemma3:1b (0.8GB, lighter), granite3.3:2b, gemma3
#   CLOUD-ONLY (useruggested): deepseek-v4-flash-0731, gemma4:cloud
#          (gemma4 local = 6.6GB → will not fit this box; "gemma4" as a
#          tag maps to cloud variant)
llm:
  active: cloud # "local" | "cloud" — switch backends here
  profiles:
    local: # free, private, no key (DEV fallback only — see below)
      base_url: "http://localhost:11434/v1"
      model: "qwen3:1.7b"
      request_timeout: 90 # qwen3:1.7b on 7GB box: cap per attempt
      retry: 1            # 1 attempt + failover to cloud when key exists
    cloud: # ollama.com/cloud — needs LLM_API_KEY in .env
      base_url: "https://ollama.com/v1"
      model: "gemma4:31b-cloud" # free-plan cloud model (server-suggested 2026-11-03)
      api_key_env: LLM_API_KEY
      request_timeout: 45 # cloud = seconds, not minutes
  temperature: 0.2
  retry: 2
  # Failover (client rule 2026-11-02): CLOUD FIRST, local as automatic
  # fallback when cloud is down / key missing. Disable by failover_enabled
  # false → then `active:` decides strictly.
  # 2026-11-04: PRODUCTION IS CLOUD-ONLY — local ollama serve turned off on
  # host (RAM freed). failover_enabled false → strict cloud, no local
  # attempts. Set true + failover_order [cloud, local] for dev fallback.
  failover_enabled: false
  failover_order: [cloud, local]

# Approval threshold + digest rule (AGENTS.md, client update 2026-11-02):
# score >= 6 instant alert + buttons; score < 6 = status 'low', daily
# digest sorted by score descending.
classifier:
  instant_alert_min_score: 6
  max_per_cycle: 12        # cloud model is fast — restored from 6
  drafts_per_cycle: 5      # M3 bid-draft budget per run
digest:
  enabled: true
  send_hour: 9 # 09:00 daily, low-score backlog + stats
  include_low_score: true
  max_low_items: 30

telegram:
  callbacks:
    poll_interval_seconds: 30 # button-press poller cadence

sources:
  reddit:
    enabled: true
    poll_rate_minutes: 15
    list_url: "https://www.reddit.com/r/{sub}/new.rss"
    subreddits:
      - automation
      - nocode
      - AI_Agents
      - AiAutomations
      - smallbusiness
      - Entrepreneur
      - n8n
  make:            # Make community forum — public Discourse RSS (M5)
    enabled: true
    poll_rate_minutes: 30
    include_hire_a_pro: true
    hire_a_pro_category_id: 50
  facebook:        # M4/M9 — needs one-time manual login first (fb_login.py)
    enabled: true
    base_url: "https://www.facebook.com"
    poll_hours: 2  # 1 poll per group per 2–4 h
    poll_groups_per_cycle: 10  # M8: shard — oldest-polled groups first
    discovery: true            # M8: auto-add groups (cap 40); terms in fb_feed.py
    discovery_cap: 40
    comments_per_cycle: 3      # M8 B1: assisted comment DRAFTS (human sends)
    comment_on: "missing-budget"  # comment when post lacks budget/scope info
    # M9 (client 2026-11-05, docs/fb-scan-report.md addendum §F): the real
    # tool-build demand lives in VN tool-market groups, not AI-education
    # communities. New pool = live slugs found by the 2026-11-05 search
    # sweep; all hydrate in headless chromium (unlike the old pool).
    groups:
      - thuecodetooltheoyeucau   # Thuê code tool theo yêu cầu
      - codetooltheoyc
      - codetheoyeucau
      - thuecodetool
      - codetoolwebappuytin      # code tool web/app uy tín
      - chiasetool
      - giacongphanmem           # gia công phần mềm
      - thietkecongcuphanmemtheoyeucau
      - TimViecLamOnlineGroup
      # 2026-11-06 (client): widen language reach — EN trial pool from the
      # live discovery sweep (data sweep 2026-11-06 in container; method
      # docs/fb-scan-report.md §B: search → sample → activity + ask check).
      # EN groups are seller-heavy: only ones with posts <24h old kept.
      # VN recruiter "tuyển dụng" job boards rejected (employment ads ≠ asks).
      - "752790164383176"        # Web Developer Jobs and Projects (active)
      - smallbusinessownerandentrepreneurs  # Small Business Owners & Entrepreneurs
      - facebook.comgroupsaiforsmallbusinessowners  # AI for Small Business Owners
      # 2026-11-06b MMO sweep (client: add MMO groups): the general MMO
      # groups are MLM/DM-bait or dead — tool-buyer demand lives in the
      # tool-niche slug family instead. 5 added from live sampling
      # (activity or exact theme; skeleton-streak skip guards dead ones).
      - "303492884368159"        # Code TOOL MMO FB/IG/TikTok/Shopee
      - pmzalo                   # Chợ Tool MMO — Phần mềm tự động Zalo
      - tooltreolivetiktok       # Treo Live TikTok — tool seeding community
      - "1568342584860887"       # Tool Đăng Bài Tự Động Facebook
      - "389278325763847"        # Kiếm tiền online (VN MMO chatter, active)
      # long-shot generic (kept per client: work & product mix) — GROUP
      # REMOVED 2026-11-06: dead education pool, permanent fb-skeleton
      # (docs/fb-scan-report.md, client-approved plan Part 4)
      # - "1646560306600683"
    # FB-side relevance filter (mirror of freelancer's M8 rule):
    # buyer-ask shape required, seller self-promo rejected. Body probe =
    # first 260 chars. Vietnamese teencode aware.
    require_keywords: [cần, tìm, thuê, hỏi giá, ai biết, giúp, hộ,
                       làm tool, viết tool, code tool, tool nào,
                       cần viết, cần code, tìm người, cần người,
                       viết cod, viết app, viết chương trình,
                       sản phẩm thi, thi khkt]
    reject_keywords: [nhận code, nhận làm, nhận viết, nhận gia công,
                      dịch vụ, uy tín, bao test, bảo hành, cam kết,
                      theo dõi, sẵn nha, giữ liên hệ, giá siêu, hiệu quả,
                      chất lượng uy, nhà phân phối, banner quảng cáo,
                      tuyển ctv, tuyển cộng tác viên, đặt hàng online,
                      # 2026-11-06 leak fix: seller ads slipping as `low`
                      # (DB rows 1265/1284 "Dạ em chào anh… tư vấn",
                      # 1268 "Mình đang có sẵn phần mềm…")
                      em chào anh, đang có sẵn, có sẵn phần mềm,
                      thiệp in, in hàng loạt, in kỹ thuật số,
                      đặt in, miễn phí, tư vấn,
                      # 2026-11-06 seller-reply shapes (rescue-pass leaks)
                      nếu bạn còn cần, còn cần thì, có thể hỗ trợ,
                      để trao đổi, supports you, can support you]
    # EN filter branch (2026-11-06 client: widen to EN tool/freelance
    # groups). Applied to posts WITHOUT Vietnamese diacritics.
    require_keywords_en: [need a developer, need a bot, need a script,
                          looking for a developer, looking for someone,
                          can anyone build, can someone build,
                          any developer, any automation, recommend,
                          looking to hire, need to hire, build me,
                          freelancer needed, need freelancer,
                          quote this, dm me, inbox me, pm me,
                          willing to pay]
    reject_keywords_en: [we offer, we provide, our services,
                         we are agency, we are a, check my page,
                         check our, cheap rates, lowest rate,
                         portfolio in comment, follow us, like my page,
                         dm for services, services available,
                         available for projects, rates start]
    state_file: "data/session_facebook.json"
  upwork:          # M5 — feed view only, never submit via code
    enabled: true
    search_query: "automation scraper bot n8n make.com zapier"
  freelancer:      # M5 — public search view, same hard rules
    enabled: true
    search_query: "automation bot scraper"
    # M8 relevance filter (client: web/app/automation/bot/CS/dev ONLY):
    # card title+body must contain >=1 require word and 0 reject words
    require_keywords: [web, app, automation, bot, scraper, crawl, script,
                       develop, developer, software, code, api, integration,
                       ai, chatbot, discord, telegram, shopify, wordpress,
                       python, node, saas, dashboard, plugin, extension,
                       backend, frontend, database, workflow]
    reject_keywords: [design, logo, typing, transcription, writing, write,
                      translate, translation, video editor, animation,
                      animate, voice over, voiceover, data entry, data-entry,
                      virtual assistant, illustration, photoshop, caption,
                      subtitle, editing, thumbnail, seo, marketing,
                      campaign, promotion, promote, backlink, smm,
                      social media, outreach, guest post, copywriting,
                      lead generation, leads generation, growth]
  x:               # M5 — SKIPPED per client 2026-11-03: X anti-login wall
    enabled: false # (phone/SMS verify demanded, click events non-accepting);
    use_session: true # session helpers stay in repo if this unparks later
    state_file: "data/session_x.json"
  linkedin:        # M5 — feed view only; manual login required first
    enabled: true
    require_session: true
    state_file: "data/session_linkedin.json"
    search_query: '"looking for" automation scraper developer'

profile:           # M3/M6: bid drafts read profile.yaml DIRECTLY (config-file
  file: profile.yaml # driven — edit the file; next cycle uses it; DB row fallback)

followup:          # pipeline/followup.py — owner reminders (private chat)
  enabled: true
  after_hours: 24
  max_per_run: 5

